[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-systemd"
version = "0.1.0"
description = "Let your Django apps manage your systemd unit files and services!"
requires-python = ">=3.10,<4.0"
authors = [
  {name = "Brian Kohan", email = "bckohan@gmail.com"},
]
license = "MIT"
license-files = [ "LICENSE" ]
readme = "README.md"
repository = "https://github.com/bckohan/django-systemd"
homepage = "https://django-systemd.readthedocs.io"
keywords = ["django", "CLI", "management", "Typer", "commands", "systemd", "services", "integration"]
dependencies = [
    "Django>=5.2,<6.2",
    "django-render-static>=3.5.0",
    "django-typer>=3.5.1",
    "enum-properties>=2.4.1",
]
classifiers = [
    "Environment :: Console",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.uv]
package = true
conflicts = [
  [
    { group = "dj52" },
    { group = "dj61" },
  ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_systemd"]

[project.optional-dependencies]
rich = [
    "rich>=10.11.0,<16.0.0",
]

[project.urls]
"Homepage" = "https://django-systemd.readthedocs.io"
"Documentation" = "https://django-systemd.readthedocs.io"
"Repository" = "https://github.com/bckohan/django-systemd"
"Issues" = "https://github.com/bckohan/django-systemd/issues"
"Changelog" = "https://django-systemd.readthedocs.io/en/stable/changelog.html"
"Code_of_Conduct" = "https://github.com/bckohan/membership/blob/main/CODE_OF_CONDUCT.md"


[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
allow_redefinition = false
check_untyped_defs = true
disallow_untyped_decorators = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_untyped_calls = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
strict_optional = true
strict_equality = true
local_partial_types = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
mypy_path = "src"
packages = ["django_systemd"]

# todo doc8 configuration here is not being picked up and doesnt seem to be working
# as expected - for now pass these parameters manually
[tool.doc8]
max-line-length = 100
sphinx = true
ignore = [ "D004" ]
ignore-path = [
  "doc/source/_static/img/*.txt"
]

[tool.pytest.ini_options]
# py.test options:
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__ shellcompletion"
env = [
    "TERMINAL_WIDTH=80",
]

addopts = [
  "--strict-markers",
  "--cov=django_systemd",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered"
]

# upstream typer has deprecated shell_completion in favor of autocomplete, but
# has not updated the autocomplete interface. We silence this warning for now
# because there is no way to fix it!
# https://github.com/fastapi/typer/pull/1006
filterwarnings = [
    "ignore:.*shell_complete.*:DeprecationWarning:typer.core"
]

[tool.coverage.run]
branch = true
source = ["django_systemd"]
concurrency = ["multiprocessing", "thread"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=django_systemd"

[tool.coverage.paths]
source = [
    "src/django_systemd"
]

[tool.pyright]
pythonVersion = "3.10"
exclude = ["tests/**/*"]
include = [
    "src/django_systemd",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "doc",
    "dist",
    "examples"
]

[tool.ruff.lint]
exclude = [
    "tests/**/*"
]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests and Django code
    "B110",  # Try, Except, Pass detected - these are intentional
]

[dependency-groups]
dj52 = ["Django>=5.2,<6.0"]
dj61 = ["Django>=6.1rc1,<6.2; python_version >= '3.12'"]
typing = [
    "mypy>=1.19.1",
    "pyright>=1.1.396",
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-stubs-ext>=5.1.3",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=44.0",
    "doc8>=1.1.2",
    "bandit[toml,sarif]>=1.7.10",
]
coverage = ["coverage[toml]>=7.6.12"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    "pytest-env>=1.1.5",
    "pytest-timeout>=2.3.1",
    "pexpect>=4.9.0",
    "pluggy>=1.5.0",
    "pywinpty>=3.0.0; sys_platform == 'win32'",
]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "readme-renderer[md]>=44.0",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-django>=2.5",
    "sphinxcontrib-typer[png]>=0.5.1",
]
colorama = ["colorama>=0.4.6"]
profiling = ["tuna>=0.5.11"]
psycopg3 = ["psycopg>=3.1.8"]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "packaging>=24.2",
    "graphviz>=0.20.3",
    "ipdb>=0.13.13",
    "ipython>=8.18.1",
    "tomlkit>=0.13.3",
    "maturin>=1.9.4; sys_platform == 'win32'",
]
